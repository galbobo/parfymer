<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eksklusive Dekanter & Prøver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6c757d;
      --primary: #111827;
      --primary-hover: #374151;
      --accent: #2563eb;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px 100px 20px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 30px auto;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .meta {
      color: var(--text-muted);
      font-size: 15px;
    }

    .controls-wrapper {
      max-width: 900px;
      margin: 0 auto 30px auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-sort-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #search {
      flex: 1;
      min-width: 240px;
      padding: 12px 18px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    #sortSelect {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #fff;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      outline: none;
      font-family: inherit;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .product {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #d1d5db;
    }

    .image-container {
      position: relative;
      background: #fff;
      aspect-ratio: 1;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #f1f3f5;
    }

    .product img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .product:hover img {
      transform: scale(1.04);
    }

    .fragrantica-link {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      padding: 4px 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      transition: all 0.2s;
    }

    .fragrantica-link:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .pricing {
      display: flex;
      gap: 8px;
    }

    .price-btn {
      flex: 1;
      background-color: #f3f4f6;
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .price-btn:hover {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .price-btn span.size {
      font-size: 10px;
      text-transform: uppercase;
      opacity: 0.75;
    }

    /* Cart drawer / floating summary */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 14px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cart-bar.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .cart-summary {
      font-size: 14px;
      font-weight: 500;
    }

    .cart-actions button {
      background: #fff;
      color: var(--primary);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cart-actions button:hover {
      background: #f1f3f5;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <header>
    <h1>Eksklusive Dekanter</h1>
    <div class="meta"><span id="countText">Laster parfymer …</span></div>
  </header>

  <div class="controls-wrapper">
    <div class="search-sort-bar">
      <input
        type="text"
        id="search"
        oninput="handleFilter()"
        placeholder="Søk etter merke eller parfyme…"
        aria-label="Søk etter merke eller parfyme"
      />
      <select id="sortSelect" onchange="handleFilter()">
        <option value="name-asc">Navn (A – Å)</option>
        <option value="name-desc">Navn (Å – A)</option>
        <option value="price-asc">Pris (lavest først)</option>
        <option value="price-desc">Pris (høyest først)</option>
      </select>
    </div>
  </div>

  <div class="grid" id="productGrid"></div>

  <!-- Flytende bestillingsoversikt -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-summary" id="cartSummary">0 valgt (0 kr)</div>
    <div class="cart-actions">
      <button onclick="copyOrder()">Kopier bestilling</button>
    </div>
  </div>

  <script>
    const productDataRaw = `
https://www.fragrantica.com/perfume/Amouage/Opus-XVI-Timber-112699.html, 330, 600, Amouage – Opus XVI – Timber
https://www.fragrantica.com/perfume/Armaf/Club-de-Nuit-Precieux-I-93272.html, 85, 150, Armaf – Club de Nuit Précieux I (Extrait)
https://www.fragrantica.com/perfume/Armaf/Odyssey-Spectra-98692.html, 70, 120, Armaf – Odyssey Spectra
https://www.fragrantica.com/perfume/Azzaro/The-Most-Wanted-Parfum-73664.html, 100, 190, Azzaro – The Most Wanted Parfum
https://www.fragrantica.com/perfume/By-Kilian/Angel-s-Share-On-The-Rocks-113083.html, 275, 540, By Kilian – Angels' Share On The Rocks
https://www.fragrantica.com/perfume/Chanel/Allure-Homme-Edition-Blanche-Eau-de-Parfum-28942.html, 140, 250, Chanel – Allure Homme Édition Blanche EdP
https://www.fragrantica.com/perfume/Chanel/Bleu-de-Chanel-Eau-de-Parfum-25967.html, 130, 240, Chanel – Bleu de Chanel EdP
https://www.fragrantica.com/perfume/Creed/Absolu-Aventus-2023-84112.html, 300, 580, Creed – Absolu Aventus (2023)
https://www.fragrantica.com/perfume/Creed/Aventus-9828.html, 260, 470, Creed – Aventus
https://www.fragrantica.com/perfume/Creed/Aventus-Cologne-51692.html, 260, 470, Creed – Aventus Cologne
https://www.fragrantica.com/perfume/Creed/Virgin-Island-Water-2007-899.html, 260, 470, Creed – Virgin Island Water (2007 vintage)
https://www.fragrantica.com/perfume/French-Avenue/Vulcan-Feu-105520.html, 100, 170, French Avenue – Vulcan Feu
https://www.fragrantica.com/perfume/Giorgio-Armani/Acqua-di-Gio-Parfum-81508.html, 110, 200, Giorgio Armani – Acqua di Giò Parfum
https://www.fragrantica.com/perfume/Giorgio-Armani/Armani-Code-Parfum-75126.html, 110, 200, Giorgio Armani – Armani Code Parfum
https://www.fragrantica.com/perfume/Giorgio-Armani/Emporio-Armani-Stronger-With-You-Absolutely-64501.html, 110, 200, Giorgio Armani – SWY Absolutely
https://www.fragrantica.com/perfume/Giorgio-Armani/Emporio-Armani-Stronger-With-You-Intensely-52802.html, 110, 200, Giorgio Armani – SWY Intensely
https://www.fragrantica.com/perfume/Goldfield-Banks-Australia/Sunset-Hour-Dark-Peach-138824.html, 160, 280, Goldfield & Banks – Sunset Hour Dark Peach
https://www.fragrantica.com/perfume/Guerlain/L-Homme-Ideal-Eau-de-Parfum-37735.html, 100, 190, Guerlain – L’Homme Idéal EdP
https://www.fragrantica.com/perfume/Hugo-Boss/Bottled-Absolu-96246.html, 130, 225, Hugo Boss – Boss Bottled Absolu
https://www.fragrantica.com/perfume/Jean-Paul-Gaultier/Le-Male-Le-Parfum-61856.html, 100, 180, Jean Paul Gaultier – Le Male Le Parfum
https://www.fragrantica.com/perfume/Jean-Paul-Gaultier/Ultra-Male-30947.html, 100, 180, Jean Paul Gaultier – Ultra Male
https://www.fragrantica.com/perfume/Louis-Vuitton/Afternoon-Swim-53947.html, 240, 460, Louis Vuitton – Afternoon Swim
https://www.fragrantica.com/perfume/Louis-Vuitton/Imagination-67370.html, 240, 460, Louis Vuitton – Imagination
https://www.fragrantica.com/perfume/Loumari/Porthole-83054.html, 260, 500, Loumari – Porthole
https://www.fragrantica.com/perfume/Mind-Games/Blockade-76717.html, 230, 450, Mind Games – Blockade
https://www.fragrantica.com/perfume/Montblanc/Explorer-52002.html, 80, 150, Montblanc – Explorer
https://www.fragrantica.com/perfume/Nishane/Hacivat-44174.html, 200, 380, Nishane – Hacivat
https://www.fragrantica.com/perfume/Parfums-de-Marly/Layton-39314.html, 200, 380, Parfums de Marly – Layton
https://www.fragrantica.com/perfume/Parfums-de-Marly/Percival-51037.html, 200, 380, Parfums de Marly – Percival
https://www.fragrantica.com/perfume/Parfums-de-Marly/Sedley-56273.html, 200, 380, Parfums de Marly – Sedley
https://www.fragrantica.com/perfume/Prada/Prada-L-Homme-39029.html, 95, 170, Prada – Prada L'Homme
https://www.fragrantica.com/perfume/Rabanne/Invictus-Parfum-90433.html, 105, 190, Rabanne – Invictus Parfum
https://www.fragrantica.com/perfume/Sospiro-Perfumes/Vibrato-75930.html, 200, 370, Sospiro – Vibrato
https://www.fragrantica.com/perfume/Tom-Ford/Oud-Wood-1826.html, 240, 450, Tom Ford – Oud Wood
https://www.fragrantica.com/perfume/Valentino/Valentino-Uomo-Born-In-Roma-Coral-Fantasy-71761.html, 110, 200, Valentino – Born In Roma Coral Fantasy
https://www.fragrantica.com/perfume/Versace/Eros-Eau-de-Parfum-62762.html, 100, 180, Versace – Eros EdP
https://www.fragrantica.com/perfume/Versace/Versace-Pour-Homme-2318.html, 75, 140, Versace – Versace Pour Homme
https://www.fragrantica.com/perfume/Xerjoff/XJ-1861-Naxos-30529.html, 150, 300, Xerjoff – XJ 1861 Naxos
https://www.fragrantica.com/perfume/Yves-Saint-Laurent/MYSLF-Le-Parfum-94983.html, 120, 220, YSL – MYSLF Le Parfum
https://www.fragrantica.com/perfume/Yves-Saint-Laurent/Y-Le-Parfum-64718.html, 140, 260, YSL – Y Le Parfum (2021 Original helsvart flaske – utgått)
https://www.fragrantica.com/perfume/Zara/Sunrise-on-the-Red-Sand-Dunes-Intense-99815.html, 60, 100, Zara – Sunrise on the Red Sand Dunes Intense
`.trim();

    function titleCaseFromSlug(slug) {
      return slug.replace(/-/g, " ").replace(/\s+/g, " ").trim();
    }

    function parseProductLine(line) {
      const parts = line.split(",").map(p => p.trim());
      const url = parts[0];
      const price5 = parseInt(parts[1], 10) || null;
      const price10 = parseInt(parts[2], 10) || null;
      const customTitle = parts[3] || null;

      const m = url.match(/\/perfume\/([^/]+)\/([^/]+)\.html$/i);
      if (!m) return null;

      const slugAndId = m[2];
      const idMatch = slugAndId.match(/-(\d+)$/);
      const id = idMatch ? idMatch[1] : null;

      let brand = "";
      let perfume = "";

      if (customTitle && customTitle.includes("–")) {
        const titleParts = customTitle.split("–");
        brand = titleParts[0].trim();
        perfume = titleParts.slice(1).join("–").trim();
      } else {
        brand = titleCaseFromSlug(m[1]);
        const perfumeSlug = id ? slugAndId.slice(0, -(id.length + 1)) : slugAndId;
        perfume = titleCaseFromSlug(perfumeSlug);
      }

      const image = id
        ? `https://fimgs.net/mdimg/perfume-thumbs/375x500.${id}.2x.avif`
        : null;

      return {
        url,
        id,
        brand,
        perfume,
        title: `${brand} – ${perfume}`,
        image,
        price5,
        price10
      };
    }

    const products = productDataRaw
      .split("\n")
      .map(s => s.trim())
      .filter(Boolean)
      .map(parseProductLine)
      .filter(Boolean);

    const grid = document.getElementById("productGrid");
    const countText = document.getElementById("countText");
    const cartBar = document.getElementById("cartBar");
    const cartSummary = document.getElementById("cartSummary");

    let cart = [];

    function renderProducts(list) {
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty-state">Ingen parfymer matcher søket ditt.</div>`;
        countText.textContent = `0 av ${products.length} parfymer`;
        return;
      }

      for (const p of list) {
        const div = document.createElement("div");
        div.className = "product";

        let pricingHtml = `<div class="pricing">`;
        if (p.price5) {
          pricingHtml += `
            <button class="price-btn" onclick="addToCart('${escapeHtml(p.brand)} - ${escapeHtml(p.perfume)}', '5ml', ${p.price5})">
              <span class="size">5 ml</span>
              <span>${p.price5} kr</span>
            </button>`;
        }
        if (p.price10) {
          pricingHtml += `
            <button class="price-btn" onclick="addToCart('${escapeHtml(p.brand)} - ${escapeHtml(p.perfume)}', '10ml', ${p.price10})">
              <span class="size">10 ml</span>
              <span>${p.price10} kr</span>
            </button>`;
        }
        pricingHtml += `</div>`;

        div.innerHTML = `
          <div class="image-container">
            <a href="${p.url}" class="fragrantica-link" target="_blank" rel="noopener" title="Åpne på Fragrantica">Info ↗</a>
            <img src="${p.image ?? ''}" alt="${escapeHtml(p.title)}" loading="lazy">
          </div>
          <div class="product-info">
            <div>
              <div class="brand-tag">${escapeHtml(p.brand)}</div>
              <div class="product-title">${escapeHtml(p.perfume)}</div>
            </div>
            ${pricingHtml}
          </div>
        `;
        grid.appendChild(div);
      }
      countText.textContent = `${list.length} av ${products.length} parfymer vises`;
    }

    function handleFilter() {
      const query = document.getElementById("search").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;

      let filtered = products.filter(p =>
        p.title.toLowerCase().includes(query) ||
        p.brand.toLowerCase().includes(query) ||
        p.perfume.toLowerCase().includes(query)
      );

      filtered.sort((a, b) => {
        if (sort === "name-asc") return a.title.localeCompare(b.title, "no");
        if (sort === "name-desc") return b.title.localeCompare(a.title, "no");
        if (sort === "price-asc") return (a.price5 || 0) - (b.price5 || 0);
        if (sort === "price-desc") return (b.price5 || 0) - (a.price5 || 0);
        return 0;
      });

      renderProducts(filtered);
    }

    function addToCart(item, size, price) {
      cart.push({ item, size, price });
      updateCartUI();
    }

    function updateCartUI() {
      if (cart.length === 0) {
        cartBar.classList.remove("active");
        return;
      }
      const total = cart.reduce((sum, i) => sum + i.price, 0);
      cartSummary.textContent = `${cart.length} stk valgt (${total} kr)`;
      cartBar.classList.add("active");
    }

    function copyOrder() {
      if (cart.length === 0) return;
      const total = cart.reduce((sum, i) => sum + i.price, 0);
      let text = "Hei! Jeg ønsker å bestille følgende prøver:\n\n";
      cart.forEach((c, idx) => {
        text += `${idx + 1}. ${c.item} (${c.size}) – ${c.price} kr\n`;
      });
      text += `\nTotal: ${total} kr`;

      navigator.clipboard.writeText(text).then(() => {
        alert("Bestillingslisten er kopiert til utklippstavlen! Du kan nå lime den inn i meldingen.");
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // Første rendering
    handleFilter();
  </script>
</body>
</html>
